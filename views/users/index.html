<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Trabajos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center pt-10">

    <div class="w-full max-w-lg bg-white p-6 rounded-lg shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-700">Hola, <span id="user-name">Mecánico</span> 👋</h1>
            <button id="logout-btn" class="text-sm text-red-500 hover:underline">Cerrar Sesión</button>
        </div>

        <div class="bg-indigo-600 text-white p-4 rounded-lg mb-6 shadow-md flex justify-between items-center">
            <div>
                <p class="text-indigo-200 text-sm">Ganancia Semanal</p>
                <p class="text-3xl font-bold total-money">$0</p>
            </div>
            <div class="text-right">
                <p class="text-indigo-200 text-sm">Trabajos</p>
                <p class="text-2xl font-bold total-count">0</p>
            </div>
        </div>

        <h3 class="text-slate-500 mb-2 uppercase text-xs font-bold tracking-wider">Historial de esta semana</h3>
        <ul class="space-y-3 max-h-96 overflow-y-auto pr-2">
            </ul>
    </div>

    <script src="/users/index.js"></script>
</body>
</html>
