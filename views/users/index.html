<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Control de Pagos</title>
</head>

<div class="min-h-screen bg-slate-50 p-6">
  <div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-end mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-800">Hola, Juan Pérez</h1>
        <p class="text-slate-500">Aquí tienes el resumen de tus ganancias de esta semana.</p>
      </div>
      <div class="text-right">
        <span class="text-xs font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full">SEMANA ACTIVA</span>
      </div>
    </header>

    <div class="bg-indigo-900 text-white p-8 rounded-3xl shadow-xl mb-8 flex justify-between items-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
      <div>
        <p class="text-indigo-200 text-sm font-medium uppercase tracking-wider">Total Acumulado</p>
        <p class="text-5xl font-black mt-1">$845.50</p>
      </div>
      <div class="hidden sm:block">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-indigo-400 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Trabajos Realizados</h3>
      <div class="space-y-4">
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
          <div class="flex items-center gap-4">
            <div class="bg-white p-2 rounded-lg shadow-sm font-bold text-indigo-600">22 Jan</div>
            <div>
              <p class="font-bold text-slate-700">Cambio de Amortiguadores</p>
              <p class="text-xs text-slate-400">Tipo: Suspensión (40% comisión)</p>
            </div>
          </div>
          <div class="text-right font-bold text-slate-800">
            $60.00
          </div>
        </div>
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
          <div class="flex items-center gap-4">
            <div class="bg-white p-2 rounded-lg shadow-sm font-bold text-indigo-600">21 Jan</div>
            <div>
              <p class="font-bold text-slate-700">Afinamiento Mayor</p>
              <p class="text-xs text-slate-400">Tipo: Motor (50% comisión)</p>
            </div>
          </div>
          <div class="text-right font-bold text-slate-800">
            $125.00
          </div>
        </div>
      </div>
      
      <button class="w-full mt-6 text-indigo-600 font-semibold text-sm hover:underline">Ver historial de semanas anteriores →</button>
    </div>
  </div>
</div>
