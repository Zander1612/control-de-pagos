<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Mecánico</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-900">

  <!-- NAV -->
  <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 id="user-welcome" class="font-black text-slate-800 text-sm sm:text-base italic">
        Hola, Mecánico
      </h1>
      <button
        id="logout-btn"
        class="text-xs font-bold text-red-500 uppercase tracking-widest hover:opacity-70 transition"
      >
        Cerrar sesión
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- RESUMEN -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-white p-5 rounded-3xl border shadow-sm">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
          Mis Ganancias
        </p>
        <h3
          id="my-earnings"
          class="text-3xl font-black text-green-600 font-mono mt-1"
        >
          $0
        </h3>
      </div>

      <div class="bg-white p-5 rounded-3xl border shadow-sm">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
          Trabajos Realizados
        </p>
        <h3
          id="my-count"
          class="text-3xl font-black text-slate-800 font-mono mt-1"
        >
          0
        </h3>
      </div>
    </section>

    <!-- LISTA -->
    <section class="space-y-4">
      <h2 class="text-sm font-black text-slate-400 uppercase tracking-tighter">
        Trabajos de la Semana
      </h2>

      <div
        id="my-services-list"
        class="grid grid-cols-1 md:grid-cols-2 gap-4"
      >
        
      </div>
    </section>

  </main>

  <script src="index.js"></script>
</body>
</html>
