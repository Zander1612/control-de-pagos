<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Mecánico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <!-- NAVBAR -->
    <nav class="bg-white border-b p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 id="user-welcome" class="font-black text-lg text-slate-800 italic">Hola, Mecánico</h1>
            <button id="logout-btn" class="text-xs font-bold text-red-500 uppercase tracking-widest px-3 py-1 bg-red-100 rounded-lg hover:bg-red-200 transition-all">Salir</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- ESTADÍSTICAS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Mis Ganancias</p>
                <h3 id="my-earnings" class="text-3xl font-black text-green-600 font-mono">$0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Trabajos Listos</p>
                <h3 id="my-count" class="text-3xl font-black text-slate-800 font-mono">0</h3>
            </div>
        </div>

        <!-- LISTA DE TRABAJOS -->
        <div class="space-y-4">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-tighter ml-1">Mis Trabajos de la Semana</h2>
            <div id="my-services-list" class="space-y-3 flex flex-col gap-3">
                <!-- Cada trabajo se renderizará como tarjeta -->
            </div>
        </div>

    </main>

    <script src="index.js"></script>
</body>
</html>
