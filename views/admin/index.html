<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Gestión de Taller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen pb-10">

    <nav class="bg-slate-800 text-white p-4 shadow-lg mb-8 border-b border-slate-700">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-2xl">🛠️</span> Panel Administrativo
            </h1>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold transition shadow-lg">
                Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="lg:col-span-1 space-y-6">
            
            <div class="bg-white rounded-xl shadow-xl overflow-hidden">
                <div class="bg-indigo-600 p-3 text-white">
                    <h2 class="font-bold text-sm uppercase">Registrar Trabajo</h2>
                </div>
                <form id="service-form" class="p-4 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Mecánico</label>
                        <select id="mechanic-select" class="w-full mt-1 p-2 border rounded text-sm bg-slate-50" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Servicio</label>
                        <select id="type-select" class="w-full mt-1 p-2 border rounded text-sm bg-slate-50" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Monto Cliente ($)</label>
                        <input type="number" id="amount-input" step="0.01" class="w-full mt-1 p-2 border rounded font-bold text-indigo-600" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Vehículo / Notas</label>
                        <input type="text" id="description-input" class="w-full mt-1 p-2 border rounded text-sm" placeholder="Ej: Ford Focus - Frenos" required>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded transition">
                        Guardar Registro
                    </button>
                </form>
            </div>

            <div class="bg-emerald-50 rounded-xl shadow-md border border-emerald-200 overflow-hidden">
                <div class="bg-emerald-600 p-3 text-white">
                    <h2 class="font-bold text-sm uppercase">Nuevo Tipo de Servicio</h2>
                </div>
                <form id="create-type-form" class="p-4 space-y-3">
                    <input type="text" id="new-type-name" placeholder="Nombre (Ej: Electricidad)" class="w-full p-2 border border-emerald-200 rounded text-sm" required>
                    <input type="number" id="new-type-percentage" placeholder="Porcentaje (Ej: 40)" class="w-full p-2 border border-emerald-200 rounded text-sm" required>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs transition">
                        + Añadir a la lista
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-6">
            
            <div class="bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                    <div class="w-full md:w-1/3">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Filtrar por empleado:</label>
                        <select id="filter-mechanic" class="w-full p-2 rounded bg-slate-700 text-white border-slate-600 focus:ring-2 focus:ring-indigo-500">
                            <option value="all">Ver todos los mecánicos</option>
                        </select>
                    </div>
                    
                    <div class="flex gap-4 w-full md:w-2/3 justify-end">
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center min-w-[140px]">
                            <p class="text-[10px] text-slate-400 uppercase font-bold">Total Bruto</p>
                            <p id="filtered-total-amount" class="text-xl font-bold text-white">$0.00</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center min-w-[140px]">
                            <p class="text-[10px] text-green-500 uppercase font-bold">A Pagar (Comisión)</p>
                            <p id="filtered-mechanic-amount" class="text-xl font-bold text-green-400">$0.00</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-xl overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase font-bold">
                            <th class="p-4 border-b">Mecánico</th>
                            <th class="p-4 border-b">Servicio / Descripción</th>
                            <th class="p-4 border-b text-right">Total Cliente</th>
                            <th class="p-4 border-b text-right text-indigo-600">Comisión</th>
                        </tr>
                    </thead>
                    <tbody id="recent-list" class="divide-y divide-slate-100 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/admin/index.js"></script>
    <script src="/views/components/nav.js"></script>
</body>
</html>
